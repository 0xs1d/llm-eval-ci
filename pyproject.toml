[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "A deterministic, CI-friendly regression harness for LLM features"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18"]

[dependency-groups]
dev = ["coverage>=7.0", "pytest>=8.0"]

[tool.coverage.run]
branch = true
source = ["llm_eval"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
show_missing = true

[project.scripts]
llm-eval = "llm_eval.cli:main"

[tool.setuptools.packages.find]
include = ["llm_eval*"]
